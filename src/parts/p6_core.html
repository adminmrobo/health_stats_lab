  var a1=0.254829592,a2=-0.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=0.3275911;

})();

var Gloss=(function(){
  var tip=document.getElementById('tip'),mode=1,core=['귀무가설','p값','검정력','신뢰구간','표준오차','자유도','t 분포','다중 비교','비지도학습','계통'];
  function show(el,key){
    var g=GL[key];if(!g)return;
    tip.innerHTML='<b>'+g[0]+'</b><span class="cat">'+g[1]+'</span><p style="margin:6px 0 0">'+g[2]+'</p>';
    tip.style.display='block';
    var r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    var x=Math.min(Math.max(8,r.left+window.scrollX),window.innerWidth-tw-8+window.scrollX);
    var y=r.top+window.scrollY-th-10;
    if(y<window.scrollY+8)y=r.bottom+window.scrollY+10;
    tip.style.left=x+'px';tip.style.top=y+'px';
  }
  function hide(){tip.style.display='none';}
  function mark(){
    var scope=document.querySelectorAll('section.level p, section.level li, section.level td, header.hero p, .first li');
    Array.prototype.forEach.call(document.querySelectorAll('.jt[data-done]'),function(e){
      e.replaceWith(document.createTextNode(e.textContent));});
    if(mode===0){bind();return;}
    var keys=Object.keys(GL).filter(function(k){return mode===1?core.indexOf(k)>=0:true;});
    keys.sort(function(a,b){return b.length-a.length;});
    /* 섹션(또는 히어로) 단위로 첫 등장에만 밑줄을 긋는다 */
    var seenBy={};
    Array.prototype.forEach.call(scope,function(p){
      if(p.closest('#kg')||p.closest('#export')||p.closest('.mathbox table')||p.closest('#tip'))return;
      var host=p.closest('section.level')||p.closest('header.hero')||document.body;
      var hid=host.id||'body';
      var seen=seenBy[hid]||(seenBy[hid]={});
      keys.forEach(function(k){
        if(seen[k])return;
        var walker=document.createTreeWalker(p,NodeFilter.SHOW_TEXT,null);
        var node,hit=null,idx=-1;
        while((node=walker.nextNode())){
          if(node.parentElement&&node.parentElement.classList.contains('jt'))continue;
          idx=node.nodeValue.indexOf(k);
          if(idx>=0){hit=node;break;}
        }
        if(!hit)return;
        var after=hit.splitText(idx),rest=after.splitText(k.length);
        var sp=document.createElement('span');
        sp.className='jt';sp.dataset.g=k;sp.dataset.done='1';sp.tabIndex=0;sp.textContent=k;
        after.replaceWith(sp);seen[k]=1;
      });
    });
    bind();
  }
  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll('.jt'),function(e){
      var key=e.dataset.g||e.textContent;
      if(e.dataset.bound)return;e.dataset.bound='1';
      e.addEventListener('mouseenter',function(){show(e,key);});
      e.addEventListener('mouseleave',hide);
      e.addEventListener('focus',function(){show(e,key);});
      e.addEventListener('blur',hide);
      e.addEventListener('click',function(ev){ev.preventDefault();show(e,key);});
    });
  }
  window.addEventListener('scroll',hide,{passive:true});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
  return {mark:mark,set:function(m){mode=m;mark();},mode:function(){return mode;}};
})();
window.LAB.Gloss=Gloss;

   why:'사람에게서 사건이 쌓이기를 기다리는 시간은 계산으로 대체되지 않습니다. 보고된 2상 실패율도 비AI와 비슷했습니다.',hint:'①단계의 병목과 같은 자리입니다.'}
 ],
};
var Study=(function(){
  var total=0,got=0,answered={};
  function render(){
    Array.prototype.forEach.call(document.querySelectorAll('.quiz[data-quiz]'),function(box){
      var key=box.dataset.quiz,items=QUIZ[key];if(!items)return;
      total+=items.length;
      var h='<h4>확인 퀴즈</h4>';
      items.forEach(function(it,i){
        h+='<div class="qit" data-k="'+key+'" data-i="'+i+'"><div class="qq">'+(i+1)+'. '+it.q+'</div><div class="qo">';
        it.o.forEach(function(o,j){h+='<button type="button" data-j="'+j+'">'+o+'</button>';});
        h+='</div><div class="fb" hidden></div></div>';
      });
      box.innerHTML=h;
      box.addEventListener('click',function(e){
        var b=e.target.closest('button[data-j]');if(!b)return;
        var it0=b.closest('.qit'),k=it0.dataset.k,i=+it0.dataset.i,j=+b.dataset.j;
        var item=QUIZ[k][i],id=k+'_'+i;
        var fb=it0.querySelector('.fb');
        if(j===item.a){
          b.classList.add('ok');
          fb.hidden=false;fb.innerHTML='<b style="color:var(--gfp)">맞았습니다.</b> '+item.why;
          if(!answered[id]){answered[id]=1;got++;upd();}
          Array.prototype.forEach.call(it0.querySelectorAll('button'),function(x){x.disabled=true;});
        }else{
          b.classList.add('no');
          fb.hidden=false;fb.innerHTML='<b style="color:var(--eye)">다시 보겠습니다.</b> '+(item.hint||item.why);
          if(!answered[id])answered[id]=0;
        }
      });
    });
    upd();
  }
  function upd(){var e=document.getElementById('stQuiz');if(e)e.textContent='퀴즈 '+got+'/'+total;}
  return {render:render};
})();

/* ---------- 진행 막대 ---------- */
(function(){
  var bar=document.getElementById('prog'),rd=document.getElementById('stRead');
  function on(){
    var h=document.documentElement,
        p=h.scrollHeight>h.clientHeight?(h.scrollTop||document.body.scrollTop)/(h.scrollHeight-h.clientHeight):0;
    p=Math.max(0,Math.min(1,p));
    bar.style.width=(p*100).toFixed(1)+'%';
    if(rd)rd.textContent='읽은 곳 '+Math.round(p*100)+'%';
  }
  window.addEventListener('scroll',on,{passive:true});window.addEventListener('resize',on);on();
})();

/* ---------- 히어로 픽셀아트 (그림 파일 없이 절차적으로) ---------- */
(function(){
  var c=document.getElementById('heroArt');if(!c)return;
  function draw(){
    var h=c.parentElement.offsetHeight||420,W=fit(c,h),x=c.getContext('2d');
    x.imageSmoothingEnabled=false;
    var px=Math.max(5,Math.round(W/150));
    function blk(gx,gy,gw,gh,col){x.fillStyle=col;x.fillRect(gx*px,gy*px,gw*px,gh*px);}
    var baseY=Math.round(h/px)-10;
    /* 창 */
    blk(Math.round(W/px)-34,3,26,16,'#eef4fb');
    blk(Math.round(W/px)-34,3,26,1,'#cdd9e8');
    blk(Math.round(W/px)-21,3,1,16,'#cdd9e8');
    blk(Math.round(W/px)-34,10,26,1,'#cdd9e8');
    /* 작업대 */
    blk(4,baseY,Math.round(W/px)-8,1,'#c8d2dd');
    /* 눈금 실린더 세 개 */
    var cols=['#9b3fb5','#13733a','#4a6a96'];
    for(var i=0;i<3;i++){
      var gx=8+i*7,ht=5+i*2;
      blk(gx,baseY-ht,3,ht,'#ffffff');
      blk(gx,baseY-ht,3,1,'#c8d2dd');
      blk(gx,baseY-Math.round(ht/2),3,Math.round(ht/2),cols[i]);
      blk(gx-1,baseY-1,5,1,'#c8d2dd');
    }
    /* 점 찍힌 모눈판 */
    var bx=Math.round(W/px)-30,by=baseY-16;
    blk(bx,by,20,12,'#ffffff');
    x.fillStyle='#d5dbe2';
    for(var r=1;r<12;r+=2)for(var q=1;q<20;q+=2)x.fillRect((bx+q)*px,(by+r)*px,px,px);
    x.fillStyle='#4a6a96';
    var seed=rng(7);
    for(var k=0;k<22;k++){
      var qq=1+Math.floor(seed()*18),rr=1+Math.floor(seed()*10);
      x.fillRect((bx+qq)*px,(by+rr)*px,px*1.4,px*1.4);
    }
    /* 저울 */
    var sx=Math.round(W/px/2)-2;
    blk(sx,baseY-7,1,7,'#8e99a6');
    blk(sx-5,baseY-8,11,1,'#8e99a6');
    blk(sx-6,baseY-6,3,1,'#a35c00');
    blk(sx+4,baseY-6,3,1,'#a35c00');
  }
  addMod(c,function(){draw();});
})();

/* ---------- 시작 ---------- */
function initComics(){
  /* 만화 그림은 한 장(2x2)으로 받아 CSS로 잘라 쓴다. 없으면 자리와 말풍선만 보인다. */
  Array.prototype.forEach.call(document.querySelectorAll('.comic[data-src]'),function(c){
    var im=new Image();
    im.onload=function(){
      Array.prototype.forEach.call(c.querySelectorAll('.art'),function(a){
        a.style.backgroundImage='url("'+c.dataset.src+'")';});
      c.classList.add('has-img');
    };
    im.onerror=function(){};
    if('IntersectionObserver' in window){
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ im.src=c.dataset.src; io.disconnect(); } });
      },{rootMargin:'400px'});
      io.observe(c);
    } else { im.src=c.dataset.src; }
  });
}
function initMode(){
  var b=document.getElementById('modeBt'),lab=document.getElementById('modeLab');
  if(!b)return;
  b.addEventListener('click',function(){
    var on=document.body.classList.toggle('comicfirst');
    b.setAttribute('aria-pressed',on?'true':'false');
    b.textContent=on?'전체 읽기로 돌아가기':'만화 우선으로 보기';
    lab.textContent=on?'지금은 만화 우선 — 만화와 3줄, 직접 만지는 모형만 남깁니다'
                      :'지금은 전체 읽기 — 설명을 모두 보여 줍니다';
    if(window.LAB&&window.LAB.redraw)window.LAB.redraw();
  });
}
function loadShots(){
  Array.prototype.forEach.call(document.querySelectorAll('img[data-src]'),function(im){
    var host=im.closest('figure')||im.closest('header');
    im.addEventListener('load',function(){ if(host)host.classList.add('has-img'); });
    im.addEventListener('error',function(){ im.remove(); });
    im.src=im.dataset.src;
  });
}
document.addEventListener('DOMContentLoaded',function(){
  loadShots();
  initComics();
  initMode();
  (function(){
    var b=document.getElementById('castBt'),mm=document.getElementById('castMore');
    if(!b||!mm)return;
    b.addEventListener('click',function(){
      var on=mm.hasAttribute('hidden');
      if(on){mm.removeAttribute('hidden');}else{mm.setAttribute('hidden','');}
      b.setAttribute('aria-expanded',on?'true':'false');
      b.textContent=on?'인턴 두 사람 접기':'순서를 챙기는 인턴 두 사람 보기';
      if(on)Cast.fill(mm);
    });
  })();
  Cast.fill();
  Gloss.mark();
  Study.render();
  var g=document.getElementById('stGloss');
  if(g)g.addEventListener('click',function(){
    var m=(Gloss.mode()+1)%3;Gloss.set(m);
    g.textContent='밑줄: '+(m===0?'끄기':m===1?'핵심':'전체');
  });
  if(window.LAB.initPanels)window.LAB.initPanels();
  if(window.LAB.initKG)window.LAB.initKG();
  window.LAB.start();
});
})();
</script>
