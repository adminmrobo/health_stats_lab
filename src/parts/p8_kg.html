<script>
/* =====================================================================
   지식 색인 + 온톨로지·서지 꾸러미
   내보내기는 Blob 다운로드만, 브라우저 저장소 사용 없음
   ===================================================================== */
(function(){
'use strict';
var L=window.LAB;
function J(id){try{return JSON.parse(document.getElementById(id).textContent);}catch(e){return null;}}
var KG=J('kg-raw'),REFS=J('refs-csl'),META=J('page-meta');
if(!KG)return;

var TYPE_KO={Concept:'개념',Method:'방법',Task:'문제',Metric:'지표',Claim:'주장',Work:'문헌',Term:'용어',
  Analogy:'비유',Question:'질문',Limitation:'한계',Simulation:'모형',QuizItem:'문항',Section:'구역',
  Theory:'이론',Assumption:'가정',Identity:'항등식',Standard:'기준',Account:'계정',Indicator:'지표',
  Distribution:'분포',Framework:'틀',BioAnalogue:'생물 대응'};
var CHIPS=['개념','방법','지표','주장','용어','질문','비유','한계','모형','분포','가정','문헌'];
var active={},q='';

/* ---------- 목록 ---------- */
function nodeKo(n){return (n.label&&n.label.ko)||n.id;}
function nodeType(n){return TYPE_KO[n.type]||n.type;}
function matches(n){
  if(Object.keys(active).length&&!active[nodeType(n)])return false;
  if(!q)return true;
  var s=(nodeKo(n)+' '+((n.label&&n.label.en)||'')+' '+
    ((n.altLabel&&n.altLabel.ko)?n.altLabel.ko.join(' '):'')+' '+
    ((n.definition&&n.definition.ko)||'')).toLowerCase();
  return s.indexOf(q.toLowerCase())>=0;
}
function evCount(n){
  var c=(n.evidence?n.evidence.length:0)+(n.source?n.source.length:0);
  KG.edges.forEach(function(e){if(e.s===n.id&&e.p==='lab:assertedIn')c++;});
  return c;
}
function renderList(){
  var box=document.getElementById('kglist'),arr=KG.nodes.filter(matches);
  if(!arr.length){box.innerHTML='<p style="color:var(--muted);font-size:14px">조건에 맞는 항목이 없습니다.</p>';return;}
  box.innerHTML=arr.map(function(n){
    return '<div class="kgi"><div class="t">'+nodeKo(n)+'<span class="ty">'+nodeType(n)+'</span></div>'+
      (n.definition&&n.definition.ko?'<p class="df">'+n.definition.ko+'</p>':'')+
      '<div style="margin-top:5px"><a href="'+(n.anchor||'#')+'">설명 보러 가기 →</a>'+
      '<span style="font-size:12px;color:var(--muted);margin-left:10px">근거 '+evCount(n)+'개</span></div></div>';
  }).join('');
}
function renderChips(){
  var box=document.getElementById('kgchips');
  box.innerHTML=CHIPS.map(function(c){return '<button type="button" data-c="'+c+'" aria-pressed="false">'+c+'</button>';}).join('');
  box.addEventListener('click',function(e){
    var b=e.target.closest('button[data-c]');if(!b)return;
    var c=b.dataset.c;
    if(active[c]){delete active[c];b.setAttribute('aria-pressed','false');}
    else{active[c]=1;b.setAttribute('aria-pressed','true');}
    renderList();
  });
}
/* ---------- 경로 ---------- */
function renderPath(){
  var pre={},node={};
  KG.nodes.forEach(function(n){node[n.id]=n;});
  KG.edges.forEach(function(e){if(e.p==='lab:prerequisiteOf')pre[e.s]=e.o;});
  var starts=Object.keys(pre).filter(function(s){
    return !Object.keys(pre).some(function(k){return pre[k]===s;});});
  var chain=[],cur=starts[0];var guard=0;
  while(cur&&guard++<12){chain.push(cur);cur=pre[cur];}
  var box=document.getElementById('kgpath');
  box.innerHTML=chain.map(function(id,i){
    var n=node[id];
    return '<span class="s'+(i===0?' on':' done')+'">'+(n?nodeKo(n):id)+'</span>'+
      (i<chain.length-1?'<span class="s" style="background:none;border:0;color:var(--muted)">→</span>':'');
  }).join('');
}
/* ---------- 열린 질문 ---------- */
function renderOpen(){
  var qs=KG.nodes.filter(function(n){return n.type==='Question';});
  document.getElementById('kgopen').innerHTML=qs.map(function(n){
    return '<div class="kgi"><div class="t">'+nodeKo(n)+'<span class="ty">질문</span></div>'+
      '<div style="margin-top:4px"><a href="'+(n.anchor||'#')+'">관련 설명 →</a></div></div>';
  }).join('');
}
/* ---------- 미니 관계 지도 ---------- */
function renderGraph(){
  var c=document.getElementById('kggraph');if(!c)return;
  var nodes=KG.nodes.filter(function(n){return n.type!=='Section'&&n.type!=='QuizItem';}).slice(0,80);
  var idx={};nodes.forEach(function(n,i){idx[n.id]=i;});
  var edges=KG.edges.filter(function(e){return idx[e.s]!==undefined&&idx[e.o]!==undefined;});
  var r=L.rng(5),P=nodes.map(function(){return {x:r()*2-1,y:r()*2-1,vx:0,vy:0};});
  for(var it=0;it<200;it++){
    for(var i=0;i<P.length;i++)for(var j=i+1;j<P.length;j++){
      var dx=P[j].x-P[i].x,dy=P[j].y-P[i].y,d2=dx*dx+dy*dy+0.01,f=0.0016/d2;
      var fx=dx*f,fy=dy*f;P[i].vx-=fx;P[i].vy-=fy;P[j].vx+=fx;P[j].vy+=fy;
    }
    edges.forEach(function(e){
      var a=P[idx[e.s]],b=P[idx[e.o]],dx=b.x-a.x,dy=b.y-a.y;
      a.vx+=dx*0.012;a.vy+=dy*0.012;b.vx-=dx*0.012;b.vy-=dy*0.012;
    });
    for(var k=0;k<P.length;k++){
      P[k].vx-=P[k].x*0.004;P[k].vy-=P[k].y*0.004;
      P[k].x+=P[k].vx;P[k].y+=P[k].vy;P[k].vx*=0.86;P[k].vy*=0.86;
    }
  }
  var COL={Concept:'#9b3fb5',Method:'#13733a',Metric:'#4a6a96',Claim:'#a35c00',Question:'#c9302c',
    Limitation:'#c9302c',Analogy:'#1e55c8',Simulation:'#5b6874',Work:'#16212b',Distribution:'#4a6a96',
    Assumption:'#5b6874',Term:'#9b3fb5'};
  function draw(){
    var W=L.fit(c,340),x=c.getContext('2d'),H=340;
    var xs=P.map(function(p){return p.x;}),ys=P.map(function(p){return p.y;});
    var lo=Math.min.apply(null,xs),hi=Math.max.apply(null,xs),
        lo2=Math.min.apply(null,ys),hi2=Math.max.apply(null,ys);
    function X(v){return 24+(W-48)*(v-lo)/((hi-lo)||1);}
    function Y(v){return 24+(H-48)*(v-lo2)/((hi2-lo2)||1);}
    x.strokeStyle='rgba(91,104,116,.22)';x.lineWidth=1;
    edges.forEach(function(e){
      var a=P[idx[e.s]],b=P[idx[e.o]];
      x.beginPath();x.moveTo(X(a.x),Y(a.y));x.lineTo(X(b.x),Y(b.y));x.stroke();
    });
    nodes.forEach(function(n,i){
      var p=P[i];x.fillStyle=COL[n.type]||'#5b6874';
      x.beginPath();x.arc(X(p.x),Y(p.y),4.5,0,Math.PI*2);x.fill();
    });
    x.font='500 10px "IBM Plex Sans KR",system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';
    nodes.forEach(function(n,i){
      if(n.type!=='Method'&&n.type!=='Limitation'&&n.type!=='Question')return;
      var p=P[i];x.fillStyle='#16212b';
      var s=nodeKo(n);if(s.length>12)s=s.slice(0,11)+'…';
      x.fillText(s,X(p.x),Y(p.y)-11);
    });
    x.textAlign='left';x.fillStyle='#5b6874';x.font='700 11px "IBM Plex Sans KR",system-ui,sans-serif';
    x.fillText('점 '+nodes.length+'개 · 관계 '+edges.length+'개 (구역·문항 제외)',24,14);
  }
  L.addMod(c,function(){draw();});
}
/* ---------- 통계 ---------- */
function renderStat(){
  var byType={};KG.nodes.forEach(function(n){var t=nodeType(n);byType[t]=(byType[t]||0)+1;});
  var rel=KG.edges.filter(function(e){return e.p==='lab:relatedTo';}).length;
  var ver=REFS?REFS.filter(function(r){return r.lab&&r.lab.verified&&r.lab.verified.title&&r.lab.verified.year;}).length:0;
  document.getElementById('kgstat').innerHTML=
    '<span>점 '+KG.nodes.length+'개</span><span>관계 '+KG.edges.length+'개</span>'+
    '<span>문헌 '+(REFS?REFS.length:0)+'건</span>'+
    '<span>relatedTo 비율 '+((rel/KG.edges.length)*100).toFixed(1)+'%</span>'+
    '<span>'+Object.keys(byType).map(function(k){return k+' '+byType[k];}).join(' · ')+'</span>';
}

/* ---------- 내보내기 형식 변환 ---------- */
function dl(name,text,mime){
  var b=new Blob([text],{type:mime||'text/plain;charset=utf-8'}),u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();},800);
}
var SCOPES=['전체','개념·방법만','주장과 출처만','선수 관계만'],scope=0;
function scoped(){
  var nodes=KG.nodes,edges=KG.edges;
  if(scope===1){
    nodes=KG.nodes.filter(function(n){return ['Concept','Method','Term','Distribution','Metric','Assumption'].indexOf(n.type)>=0;});
  }else if(scope===2){
    nodes=KG.nodes.filter(function(n){return n.type==='Claim'||n.type==='Work';});
  }else if(scope===3){
    nodes=KG.nodes.slice();
    edges=KG.edges.filter(function(e){return e.p==='lab:prerequisiteOf';});
    var keep={};edges.forEach(function(e){keep[e.s]=1;keep[e.o]=1;});
    nodes=nodes.filter(function(n){return keep[n.id];});
    return {nodes:nodes,edges:edges};
  }
  var ids={};nodes.forEach(function(n){ids[n.id]=1;});
  edges=KG.edges.filter(function(e){return ids[e.s]&&ids[e.o];});
  return {nodes:nodes,edges:edges};
}
function csvNodes(){
  var s=scoped(),out='﻿id,type,label_ko,label_en,status,level,family,page,anchor\n';
  s.nodes.forEach(function(n){
    out+=[n.id,n.type,'"'+nodeKo(n).replace(/"/g,'""')+'"','"'+(((n.label||{}).en)||'')+'"',
      n.status||'',n.level||'',n.family||'',n.page||'',n.anchor||''].join(',')+'\n';});
  return out;
}
function csvEdges(){
  var s=scoped(),out='﻿source,predicate,target,anchor,confidence\n';
  s.edges.forEach(function(e){out+=[e.s,e.p,e.o,e.anchor||'',e.confidence||''].join(',')+'\n';});
  return out;
}
function ttl(){
  var s=scoped();
  var o='@prefix lab: <urn:lab:> .\n@prefix skos: <http://www.w3.org/2004/02/skos/core#> .\n'+
        '@prefix schema: <https://schema.org/> .\n@prefix dct: <http://purl.org/dc/terms/> .\n\n';
  s.nodes.forEach(function(n){
    var id='lab:'+n.id.replace(/^lab:/,'');
    o+='<'+id.replace('lab:','urn:lab:')+'> a skos:Concept ;\n';
    o+='  skos:prefLabel "'+nodeKo(n).replace(/"/g,'\\"')+'"@ko ';
    if(n.label&&n.label.en)o+=', "'+n.label.en.replace(/"/g,'\\"')+'"@en ';
    o+=';\n';
    if(n.definition&&n.definition.ko)o+='  skos:definition "'+n.definition.ko.replace(/"/g,'\\"')+'"@ko ;\n';
    o+='  lab:type "'+n.type+'" ;\n  lab:domain "'+((n.domain||[]).join(' '))+'" .\n\n';
  });
  var MAP={'lab:broader':'skos:broader','lab:relatedTo':'skos:related','lab:partOf':'schema:isPartOf','lab:assertedIn':'schema:citation'};
  s.edges.forEach(function(e){
    var p=MAP[e.p]||('urn:'+e.p.replace('lab:','lab:'));
    o+='<'+e.s.replace('lab:','urn:lab:')+'> '+(MAP[e.p]?p:'<'+e.p.replace('lab:','urn:lab:')+'>')+' <'+e.o.replace('lab:','urn:lab:')+'> .\n';
  });
  return o;
}
function jsonld(){
  var s=scoped();
  var g=s.nodes.map(function(n){
    var o={'@id':n.id.replace('lab:','urn:lab:'),'@type':['skos:Concept','schema:DefinedTerm'],
      'skos:prefLabel':[{'@value':nodeKo(n),'@language':'ko'}]};
    if(n.label&&n.label.en)o['skos:prefLabel'].push({'@value':n.label.en,'@language':'en'});
    if(n.definition&&n.definition.ko)o['skos:definition']={'@value':n.definition.ko,'@language':'ko'};
    o['lab:type']=n.type;o['lab:domain']=n.domain||[];
    return o;
  });
  return JSON.stringify({'@context':{skos:'http://www.w3.org/2004/02/skos/core#',schema:'https://schema.org/',
    dct:'http://purl.org/dc/terms/',prov:'http://www.w3.org/ns/prov#',lab:'urn:lab:'},'@graph':g},null,1);
}
function bib(){
  if(!REFS)return '';
  return REFS.map(function(r){
    var ty=r.type==='article-journal'?'article':(r.type==='webpage'?'misc':'article');
    var au=(r.author||[]).map(function(a){return a.literal||((a.family||'')+(a.given?', '+a.given:''));}).join(' and ');
    var y=r.issued&&r.issued['date-parts']?r.issued['date-parts'][0][0]:'';
    var o='@'+ty+'{'+r.id+',\n  title = {'+(r.title||'')+'},\n';
    if(au)o+='  author = {'+au+'},\n';
    if(y)o+='  year = {'+y+'},\n';
    if(r['container-title'])o+='  journal = {'+r['container-title']+'},\n';
    if(r.volume)o+='  volume = {'+r.volume+'},\n';
    if(r.page)o+='  pages = {'+r.page+'},\n';
    if(r.URL)o+='  url = {'+r.URL+'},\n';
    if(r.lab&&r.lab.note)o+='  note = {'+r.lab.note+'},\n';
    return o.replace(/,\n$/,'\n')+'}\n';
  }).join('\n');
}
function ris(){
  if(!REFS)return '';
  return REFS.map(function(r){
    var ty=r.type==='article-journal'?'JOUR':(r.type==='webpage'?'ELEC':'GEN');
    var o='TY  - '+ty+'\n';
    (r.author||[]).forEach(function(a){o+='AU  - '+(a.literal||((a.family||'')+(a.given?', '+a.given:'')))+'\n';});
    o+='TI  - '+(r.title||'')+'\n';
    var y=r.issued&&r.issued['date-parts']?r.issued['date-parts'][0][0]:'';
    if(y)o+='PY  - '+y+'\n';
    if(r['container-title'])o+='JO  - '+r['container-title']+'\n';
    if(r.volume)o+='VL  - '+r.volume+'\n';
    if(r.page)o+='SP  - '+r.page+'\n';
    if(r.URL)o+='UR  - '+r.URL+'\n';
    if(r.lab&&r.lab.note)o+='N1  - '+r.lab.note+'\n';
    return o+'ER  - \n';
  }).join('\n');
}
function provenance(){
  var out='﻿item,kind,work,loc,factCard,confidence,verified,pageAnchor\n';
  KG.nodes.forEach(function(n){
    if(!n.source&&!n.evidence)return;
    var w=(n.source&&n.source[0]&&n.source[0].cite)||'',lc=(n.source&&n.source[0]&&n.source[0].loc)||'';
    out+=[n.id,'node','"'+w+'"','"'+lc+'"','"'+((n.evidence||[]).join(' '))+'"',n.confidence||'',
      (n.source?'true':'false'),n.anchor||''].join(',')+'\n';
  });
  KG.edges.forEach(function(e){
    if(!e.evidence)return;
    out+=[e.s+' '+e.p+' '+e.o,'edge','','','"'+e.evidence.join(' ')+'"',e.confidence||'','false',e.anchor||''].join(',')+'\n';
  });
  return out;
}
function mermaid(){
  var s=scoped(),nodes=s.nodes.slice(0,40),idx={};
  nodes.forEach(function(n,i){idx[n.id]='N'+i;});
  var o='graph TD\n';
  nodes.forEach(function(n){o+='  '+idx[n.id]+'["'+nodeKo(n).replace(/"/g,'')+'"]\n';});
  s.edges.forEach(function(e){
    if(!idx[e.s]||!idx[e.o])return;
    o+='  '+idx[e.s]+' -->|'+e.p.replace('lab:','')+'| '+idx[e.o]+'\n';
  });
  return o;
}
function readme(n){
  return '연구실 해설 대시보드 · 보건통계 01 — 온톨로지·서지 꾸러미\n'+
  '===============================================================\n\n'+
  '만든 날: '+new Date().toISOString().slice(0,10)+'\n'+
  '페이지: '+META.title+' (v'+META.version+')\n'+
  '범위: '+SCOPES[scope]+'\n'+
  '담긴 파일 수: '+n+'\n\n'+
  '[인용]\n'+META.suggestedCitation+'\n\n'+
  '[구성]\n'+
  ' manifest.json            꾸러미 목록과 집계\n'+
  ' page_meta.json           페이지 자체의 서지 정보\n'+
  ' kg.json                  중립 지식 그래프 (원본)\n'+
  ' kg.jsonld                JSON-LD 변환\n'+
  ' kg.ttl                   Turtle 변환\n'+
  ' nodes.csv / edges.csv    표 형식 (UTF-8 BOM)\n'+
  ' references.csl.json      참고문헌 원본\n'+
  ' references.bib / .ris    문헌 관리 도구용\n'+
  ' provenance.csv           주장 ↔ 문헌 ↔ 원문 위치\n'+
  ' README.txt               이 파일\n\n'+
  '[확인 필요]\n'+todoLines().map(function(s){return ' - '+s;}).join('\n')+'\n\n'+
  '[주의]\n'+
  ' 이 페이지의 모의실험 수치는 설명용 모형이며 실제 측정값이 아닙니다.\n'+
  ' 저자·라이선스·공개 주소는 비어 있으면 아직 정하지 않은 것입니다.\n';
}
function todoLines(){
  var out=[];
  if(REFS)REFS.forEach(function(r){
    var v=r.lab&&r.lab.verified||{},miss=[];
    ['doi','pages','authors','venue','title','year'].forEach(function(k){if(v[k]===false)miss.push(k);});
    if(miss.length)out.push(r.id+' — 확인 필요: '+miss.join(', '));
  });
  if(!META.license)out.push('page_meta.license — 라이선스를 정해 채울 것');
  if(!META.url)out.push('page_meta.url — 공개 주소를 채울 것');
  KG.nodes.forEach(function(n){
    if(n.type==='Claim'&&!n.source)out.push(n.id+' — 주장에 출처가 없음 (질문으로 돌릴 것)');
  });
  return out;
}

/* ---------- 압축 없는 ZIP ---------- */
var CRCT=(function(){var t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(buf){var c=0xFFFFFFFF;for(var i=0;i<buf.length;i++)c=CRCT[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  var enc=new TextEncoder(),parts=[],central=[],off=0;
  function u16(v){return [v&255,(v>>8)&255];}
  function u32(v){return [v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];}
  files.forEach(function(f){
    var data=enc.encode(f.body),nm=enc.encode(f.name),cc=crc32(data);
    var lh=[].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(cc),u32(data.length),u32(data.length),u16(nm.length),u16(0));
    parts.push(new Uint8Array(lh),nm,data);
    central.push({nm:nm,cc:cc,len:data.length,off:off});
    off+=lh.length+nm.length+data.length;
  });
  var cdir=[],cstart=off;
  central.forEach(function(c){
    var h=[].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(c.cc),u32(c.len),u32(c.len),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off));
    cdir.push(new Uint8Array(h),c.nm);
    off+=h.length+c.nm.length;
  });
  var end=new Uint8Array([].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),
    u16(files.length),u16(files.length),u32(off-cstart),u32(cstart),u16(0)));
  return new Blob(parts.concat(cdir,[end]),{type:'application/zip'});
}
function bundle(){
  var s=scoped();
  var fs=[
    {name:'page_meta.json',body:JSON.stringify(META,null,1)},
    {name:'kg.json',body:JSON.stringify({version:KG.version,page:KG.page,domain:KG.domain,nodes:s.nodes,edges:s.edges},null,1)},
    {name:'kg.jsonld',body:jsonld()},
    {name:'kg.ttl',body:ttl()},
    {name:'nodes.csv',body:csvNodes()},
    {name:'edges.csv',body:csvEdges()},
    {name:'references.csl.json',body:JSON.stringify(REFS,null,1)},
    {name:'references.bib',body:bib()},
    {name:'references.ris',body:ris()},
    {name:'provenance.csv',body:provenance()}
  ];
  fs.push({name:'README.txt',body:readme(fs.length+2)});
  fs.unshift({name:'manifest.json',body:JSON.stringify({
    package:'lab-explainer-bundle',version:'1.0',page:KG.page,created:new Date().toISOString().slice(0,10),
    scope:SCOPES[scope],counts:{nodes:s.nodes.length,edges:s.edges.length,references:REFS?REFS.length:0},
    files:fs.map(function(f){return f.name;}).concat(['manifest.json']),registry:'KG_00_registry.json 미포함'
  },null,1)});
  return fs;
}
function renderFiles(){
  var fs=bundle();
  var box=document.getElementById('filebtns');
  box.innerHTML='<button class="bt primary" data-zip="1">꾸러미 ZIP ('+fs.length+'개 파일)</button>'+
    fs.map(function(f){return '<button data-f="'+f.name+'">'+f.name+'</button>';}).join('');
  box.onclick=function(e){
    var b=e.target.closest('button');if(!b)return;
    var all=bundle();
    if(b.dataset.zip){
      var blob=zip(all),u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download='lab_bundle_'+KG.page+'.zip';document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(u);a.remove();},800);
      return;
    }
    var nm=b.dataset.f,f=all.filter(function(x){return x.name===nm;})[0];
    if(f)dl(f.name,f.body,nm.indexOf('.json')>=0?'application/json':'text/plain;charset=utf-8');
  };
}
function renderScope(){
  var box=document.getElementById('scope');
  box.innerHTML=SCOPES.map(function(s,i){return '<button type="button" data-i="'+i+'" aria-pressed="'+(i===0?'true':'false')+'">'+s+'</button>';}).join('');
  box.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]');if(!b)return;
    scope=+b.dataset.i;
    Array.prototype.forEach.call(box.children,function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');
    renderFiles();renderExpKpi();
  });
}
/* ---------- 인용 ---------- */
function renderCite(){
  var fmts=['일반 문장','BibTeX','RIS'],cur=0;
  var box=document.getElementById('citefmt'),out=document.getElementById('citeout');
  box.innerHTML=fmts.map(function(f,i){return '<button type="button" data-i="'+i+'" aria-pressed="'+(i===0?'true':'false')+'">'+f+'</button>';}).join('');
  function body(){
    if(cur===0)return META.suggestedCitation;
    if(cur===1)return '@misc{ahn2026clinicalstats,\n  title = {'+META.title+'},\n  author = {안상선},\n  year = {2026},\n  note = {'+META.series+' '+META.number+', v'+META.version+'},\n  howpublished = {온라인 해설 페이지}\n}';
    return 'TY  - ELEC\nAU  - 안상선\nTI  - '+META.title+'\nPY  - 2026\nN1  - '+META.series+' '+META.number+', v'+META.version+'\nER  - ';
  }
  function show(){out.textContent=body();}
  box.addEventListener('click',function(e){
    var b=e.target.closest('button[data-i]');if(!b)return;
    cur=+b.dataset.i;
    Array.prototype.forEach.call(box.children,function(x){x.setAttribute('aria-pressed','false');});
    b.setAttribute('aria-pressed','true');show();
  });
  show();
  document.getElementById('citecopy').addEventListener('click',function(){
    var msg=document.getElementById('citemsg');
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(body()).then(function(){msg.textContent='복사했습니다.';},
        function(){msg.textContent='복사가 막혀 있습니다. 위 글을 직접 선택해 주세요.';});
    }else{
      var r=document.createRange();r.selectNodeContents(out);
      var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
      msg.textContent='위 글이 선택됐습니다. 직접 복사해 주세요.';
    }
  });
}
/* ---------- 참고문헌 목록 ---------- */
function renderRefs(){
  if(!REFS)return;
  var byWork={};
  KG.nodes.forEach(function(n){
    if(n.source)n.source.forEach(function(s){
      byWork[s.cite]=(byWork[s.cite]||0)+1;});
  });
  document.getElementById('reflist').innerHTML=REFS.map(function(r){
    var v=r.lab&&r.lab.verified||{},ok=v.title&&v.year;
    var y=r.issued&&r.issued['date-parts']?r.issued['date-parts'][0][0]:'';
    var au=(r.author||[]).map(function(a){return a.literal||a.family;}).join(', ');
    var sup=(r.lab&&r.lab.supports)?r.lab.supports.length:0;
    return '<div class="refli"><span class="bg'+(ok?'':' no')+'">'+(ok?'확인':'미확인')+'</span>'+
      '<span class="bg" style="background:var(--accent-soft);color:#2f4a6d">'+((r.lab&&r.lab.role)||'배경')+'</span>'+
      (au?au+' ':'')+(y?'('+y+'). ':'')+r.title+(r['container-title']?'. <i>'+r['container-title']+'</i>':'')+
      (r.volume?' '+r.volume:'')+(r.page?':'+r.page:'')+'.'+
      '<div class="rl">뒷받침하는 개념 '+sup+'개'+(r.lab&&r.lab.note?' · '+r.lab.note:'')+
      (r.URL?' · <a href="'+r.URL+'" target="_blank" rel="noopener">원문</a>':'')+'</div></div>';
  }).join('');
}
function renderTodo(){
  var t=todoLines();
  document.getElementById('todolist').innerHTML=t.length?
    ('<ol style="margin:0;padding-left:20px;font-size:13.5px">'+t.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>'):
    '<p style="font-size:13.5px;color:var(--muted);margin:0">채울 항목이 없습니다.</p>';
  var n=t.length;
  document.getElementById('expSay').textContent='출처 없는 주장은 꾸러미에 넣지 않았어요. 확인할 항목 '+n+'개는 위에 있어요.';
}
function renderExpKpi(){
  var s=scoped(),claims=KG.nodes.filter(function(n){return n.type==='Claim';});
  var withSrc=claims.filter(function(n){return n.source;}).length;
  var ver=REFS?REFS.filter(function(r){var v=r.lab&&r.lab.verified||{};return v.title&&v.year;}).length:0;
  L.kpi(document.getElementById('expkpi'),[
    {k:'점',v:s.nodes.length+'개',c:'s',n:'범위: '+SCOPES[scope]},
    {k:'관계',v:s.edges.length+'개',c:'m',n:'끊긴 관계 0'},
    {k:'문헌',v:(REFS?REFS.length:0)+'건',c:'a',n:'확인 '+ver+'건'},
    {k:'출처 있는 주장',v:(claims.length?Math.round(withSrc/claims.length*100):0)+'%',c:'g',n:withSrc+' / '+claims.length}
  ]);
}

window.LAB.initKG=function(){
  renderChips();renderList();renderPath();renderOpen();renderGraph();renderStat();
  renderScope();renderFiles();renderCite();renderRefs();renderTodo();renderExpKpi();
  var qi=document.getElementById('kgq');
  qi.addEventListener('input',function(){q=qi.value.trim();renderList();});
  document.getElementById('kgclear').addEventListener('click',function(){
    qi.value='';q='';active={};
    Array.prototype.forEach.call(document.querySelectorAll('#kgchips button'),function(b){b.setAttribute('aria-pressed','false');});
    renderList();
  });
  document.getElementById('kgjson').addEventListener('click',function(){
    var s=scoped();dl('kg_'+KG.page+'.json',JSON.stringify({version:KG.version,page:KG.page,nodes:s.nodes,edges:s.edges},null,1),'application/json');
  });
  document.getElementById('kgmmd').addEventListener('click',function(){dl('kg_'+KG.page+'.mmd',mermaid());});
};
})();
</script>
